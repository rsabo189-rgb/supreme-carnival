<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #080808;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #fff;
      }
      #root { position: relative; }

      .acts { position: absolute; left: 96px; top: 48px; display: flex; gap: 34px; }
      .acts svg { width: 34px; height: 34px; stroke: #5f5f5f; }

      .export { position: absolute; right: 150px; top: 150px;
        background: #2b2b2d; border-radius: 16px; padding: 28px 44px;
        font-size: 40px; color: #f0f0f0; }

      .composer { position: absolute; left: 60px; top: 380px; width: 1800px; height: 460px;
        border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; }
      .ptext { position: absolute; left: 56px; top: 64px; right: 56px; font-size: 52px; color: #fff; }
      .ptext.empty { color: #5f5f5f; }
      .caret { display: inline-block; width: 4px; height: 0.9em; background: #fff;
        vertical-align: -0.08em; margin-left: 4px; opacity: 0; animation: blink 1s steps(1,end) infinite; }
      @keyframes blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }

      .crow { position: absolute; left: 40px; right: 40px; bottom: 44px; display: flex; align-items: center; gap: 56px; }
      .ci { display: inline-flex; align-items: center; gap: 18px; font-size: 40px; color: #cfcfcf; }
      .ci svg { width: 40px; height: 40px; }
      .ci.bb { color: #6ea8ff; }
      .ci.bb .x { color: #8c8c93; margin-left: 10px; }
      .ci.model { margin-left: auto; }
      .send { width: 84px; height: 84px; border-radius: 50%; background: rgba(255,255,255,0.08);
        display: inline-flex; align-items: center; justify-content: center; }
      .send svg { width: 38px; height: 38px; }
      .foot { position: absolute; left: 60px; width: 1800px; top: 880px; text-align: center;
        font-size: 30px; color: #4a4a4a; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">

      <div class="acts">
        <svg viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2.5" stroke="#5f5f5f" stroke-width="1.6"/><path d="M16 8 V6 a2 2 0 0 0-2-2 H6 a2 2 0 0 0-2 2 V14 a2 2 0 0 0 2 2 H8" stroke="#5f5f5f" stroke-width="1.6"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><path d="M7 10 V20 H5 V10 Z M7 10 L11 3 a2 2 0 0 1 2 2 V8 H18 a1.5 1.5 0 0 1 1.5 2 L18 19 a1.5 1.5 0 0 1-1.5 1 H7" stroke="#5f5f5f" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><path d="M17 14 V4 H19 V14 Z M17 14 L13 21 a2 2 0 0 1-2-2 V16 H6 a1.5 1.5 0 0 1-1.5-2 L6 5 a1.5 1.5 0 0 1 1.5-1 H17" stroke="#5f5f5f" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12 a8 8 0 0 1 13-6 M20 6 V11 H15" stroke="#5f5f5f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <div class="export">View &amp; Export Estimate</div>

      <div class="composer">
        <div class="ptext empty" id="ph">Write a message...</div>
        <div class="ptext" id="ptextRow" style="opacity:0"><span id="typed"></span><span class="caret" id="caret"></span></div>
        <div class="crow">
          <div class="ci"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5 V19 M5 12 H19" stroke="#cfcfcf" stroke-width="1.8" stroke-linecap="round"/></svg></div>
          <div class="ci"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7 H14 M18 7 H20 M4 17 H8 M12 17 H20" stroke="#cfcfcf" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" stroke="#cfcfcf" stroke-width="1.8"/><circle cx="10" cy="17" r="2.2" stroke="#cfcfcf" stroke-width="1.8"/></svg> Tools</div>
          <div class="ci bb"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2" stroke="#6ea8ff" stroke-width="1.7"/><path d="M8 7 H16 M8 11 H10 M13 11 H16 M8 14 H10 M13 14 H16" stroke="#6ea8ff" stroke-width="1.5" stroke-linecap="round"/></svg> Budget Builder <span class="x">&#10005;</span></div>
          <div class="ci model"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 L13.4 9 L19 10.5 L13.4 12 L12 18 L10.6 12 L5 10.5 L10.6 9 Z" fill="#cfcfcf"/></svg> Haiku 4.5</div>
          <div class="send"><svg viewBox="0 0 24 24" fill="none"><path d="M12 19 V5" stroke="#cfcfcf" stroke-width="2.4" stroke-linecap="round"/><path d="M6 11 L12 5 L18 11" stroke="#cfcfcf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </div>
      </div>
      <div class="foot">All figures are ballpark estimates, not final bids.</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const fullText = "Make it presentable.";
      const typed = document.getElementById("typed");
      const proxy = { n: 0 };

      // placeholder fades out, typed row fades in, then types on
      tl.to("#ph", { opacity: 0, duration: 0.25 }, 0.4);
      tl.set("#ptextRow", { opacity: 1 }, 0.55);
      tl.set("#caret", { opacity: 1 }, 0.55);
      tl.to(proxy, {
        n: fullText.length, duration: 1.7, ease: "none",
        onUpdate() { typed.textContent = fullText.slice(0, Math.round(proxy.n)); },
      }, 0.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
