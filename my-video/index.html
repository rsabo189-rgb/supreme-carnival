<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #0d0d0d; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      #root { position: relative; }

      /* ---- Sidebar ---- */
      .sidebar {
        position: absolute; left: 0; top: 0; width: 150px; height: 1080px;
        border-right: 1px solid rgba(255,255,255,0.08);
      }
      .logo {
        position: absolute; left: 22px; top: 34px; width: 108px;
        mix-blend-mode: lighten;
      }
      .avatar {
        position: absolute; left: 30px; bottom: 40px;
        width: 52px; height: 52px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.22);
        display: flex; align-items: center; justify-content: center;
        font-size: 22px; color: #cfcfcf;
      }

      /* ---- Grid ---- */
      .main {
        position: absolute; left: 150px; top: 0; right: 0; bottom: 0;
        padding: 30px 44px;
      }
      .grid {
        display: flex; flex-direction: column; gap: 20px;
        transform-origin: 50% 50%;
      }
      .row { display: flex; gap: 27px; }

      .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .card {
        width: 400px; border-radius: 16px; overflow: hidden;
        border: 1px solid rgba(255,255,255,0.12);
        background:
          radial-gradient(120% 100% at 50% 35%, #8e9094 0%, #6f7175 60%, #54565a 100%);
      }
      .card img { width: 100%; height: 100%; display: block; }
      .h-head { height: 270px; }
      .h-body { height: 300px; }
      .head img, .master img { object-fit: cover; object-position: center 20%; }
      .body img { object-fit: contain; }
      .label { font-size: 28px; color: #f3f3f3; letter-spacing: 0.3px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">

      <div class="sidebar">
        <img class="logo" src="./assets/wonder-logo.png" alt="WONDER" />
        <div class="avatar">W</div>
      </div>

      <div class="main">
        <div class="grid">

          <!-- Row 1: Master -->
          <div class="row">
            <div class="cell master">
              <div class="card h-head"><img src="./assets/master.png" /></div>
              <div class="label">Master</div>
            </div>
          </div>

          <!-- Row 2: Headshots -->
          <div class="row">
            <div class="cell head"><div class="card h-head"><img src="./assets/head-front.png" /></div><div class="label">Front</div></div>
            <div class="cell head"><div class="card h-head"><img src="./assets/head-side.png" /></div><div class="label">Side</div></div>
            <div class="cell head"><div class="card h-head"><img src="./assets/head-back.png" /></div><div class="label">Back</div></div>
            <div class="cell head"><div class="card h-head"><img src="./assets/head-34.png" /></div><div class="label">&frac34;</div></div>
          </div>

          <!-- Row 3: Full body -->
          <div class="row">
            <div class="cell body"><div class="card h-body"><img src="./assets/body-front.png" /></div><div class="label">Front</div></div>
            <div class="cell body"><div class="card h-body"><img src="./assets/body-side.png" /></div><div class="label">Side</div></div>
            <div class="cell body"><div class="card h-body"><img src="./assets/body-back.png" /></div><div class="label">Back</div></div>
            <div class="cell body"><div class="card h-body"><img src="./assets/body-34.png" /></div><div class="label">&frac34;</div></div>
          </div>

        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Slow continuous push-in keeps the whole sheet alive
      tl.fromTo(".grid", { scale: 1.0 }, { scale: 1.018, duration: 6, ease: "none" }, 0);

      // Cascade: each card builds on with a dynamic pop, in reading order
      tl.from(
        ".cell",
        {
          opacity: 0, scale: 0.82, y: 46, filter: "blur(10px)",
          transformOrigin: "50% 60%",
          duration: 0.72, ease: "back.out(1.5)", stagger: 0.2,
        },
        0.3
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
