<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; }
      .scene { position: absolute; inset: 0; transform-origin: 38% 58%; will-change: transform, opacity; }
      .scene img { width: 1920px; height: 1080px; object-fit: cover; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="scene" id="scene">
        <img src="./assets/brief-chat.png" alt="" />
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1) quick animate-on: fade + slight scale settle
      tl.fromTo("#scene",
        { opacity: 0, scale: 1.04 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 0.1);

      // 2) slow continuous push-in toward the brief artifact for the rest
      tl.to("#scene", { scale: 1.16, duration: 4.3, ease: "power1.inOut" }, 0.65);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
