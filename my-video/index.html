<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #fff;
      }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      .hero { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }

      /* Fresh frosted-glass composer placed over the baked-in one */
      .composer {
        position: absolute; left: 326px; top: 452px; width: 1268px; height: 360px;
        border-radius: 28px;
        background: rgba(28,30,36,0.42);
        backdrop-filter: blur(26px) saturate(120%);
        -webkit-backdrop-filter: blur(26px) saturate(120%);
        border: 1px solid rgba(255,255,255,0.14);
        box-shadow: 0 30px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
      }
      .ptext {
        position: absolute; left: 56px; right: 56px; top: 52px;
        font-size: 40px; line-height: 1.34; font-weight: 400; color: #f3f3f3;
        text-shadow: 0 1px 10px rgba(0,0,0,0.35); white-space: pre-wrap;
      }
      .caret { display: inline-block; width: 3px; height: 0.9em; background: #fff;
        vertical-align: -0.08em; margin-left: 4px; opacity: 0;
        animation: blink 1s steps(1,end) infinite; }
      @keyframes blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }

      .toolbar { position: absolute; left: 44px; right: 36px; bottom: 36px;
        display: flex; align-items: center; gap: 40px; }
      .ti { display: inline-flex; align-items: center; gap: 16px; font-size: 30px; color: #d7d9de; }
      .ti svg { width: 32px; height: 32px; }
      .ti.plus svg { width: 36px; height: 36px; }
      .ti.cs { color: #6ea8ff; }
      .ti.cs .x { color: #8c8c93; margin-left: 8px; font-size: 28px; }
      .ti.model { margin-left: auto; }
      .send { width: 70px; height: 70px; border-radius: 50%; background: #fff;
        display: inline-flex; align-items: center; justify-content: center; }
      .send svg { width: 32px; height: 32px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">

      <img class="hero" src="./assets/plate.png" alt="" />

      <div class="composer">
        <div class="ptext"><span id="typed"></span><span class="caret" id="caret"></span></div>
        <div class="toolbar">
          <div class="ti plus"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5 V19 M5 12 H19" stroke="#d7d9de" stroke-width="1.9" stroke-linecap="round"/></svg></div>
          <div class="ti"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7 H14 M18 7 H20 M4 17 H8 M12 17 H20" stroke="#d7d9de" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" stroke="#d7d9de" stroke-width="1.8"/><circle cx="10" cy="17" r="2.2" stroke="#d7d9de" stroke-width="1.8"/></svg> Tools</div>
          <div class="ti cs"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18 H15 M10 21 H14" stroke="#6ea8ff" stroke-width="1.8" stroke-linecap="round"/><path d="M12 3 a6 6 0 0 0-4 10.5 c0.8 0.8 1 1.4 1 2.5 H15 c0-1.1 0.2-1.7 1-2.5 A6 6 0 0 0 12 3 Z" stroke="#6ea8ff" stroke-width="1.8" stroke-linejoin="round"/></svg> Creative Strategist <span class="x">&#10005;</span></div>
          <div class="ti model"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 L13.4 9 L19 10.5 L13.4 12 L12 18 L10.6 12 L5 10.5 L10.6 9 Z" fill="#d7d9de"/><path d="M18 4 L18.7 6.3 L21 7 L18.7 7.7 L18 10 L17.3 7.7 L15 7 L17.3 6.3 Z" fill="#d7d9de"/></svg> Sonnet 4.6</div>
          <div class="send"><svg viewBox="0 0 24 24" fill="none"><path d="M12 19 V5" stroke="#111" stroke-width="2.6" stroke-linecap="round"/><path d="M6 11 L12 5 L18 11" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </div>
      </div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const fullText = "Just got the brief. Adding a few thought starters and trends. Lets get sharp.";
      const typed = document.getElementById("typed");
      const proxy = { n: 0 };

      // type on (0.3s–3.0s) then hold
      tl.to(proxy, {
        n: fullText.length, duration: 2.7, ease: "none",
        onUpdate() { typed.textContent = fullText.slice(0, Math.round(proxy.n)); },
        onComplete() { document.getElementById("caret").style.opacity = 1; },
      }, 0.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
