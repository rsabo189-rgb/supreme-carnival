<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #fff;
      }
      #root { position: relative; width: 1920px; height: 1080px; display: flex;
        flex-direction: column; align-items: center; justify-content: center; }

      .bubble {
        max-width: 1120px; background: #1c1c1e; border-radius: 40px;
        padding: 52px 72px; margin-bottom: 38px;
      }
      .btext { font-size: 76px; line-height: 1.28; font-weight: 500; color: #fff;
        letter-spacing: -0.5px; white-space: pre-wrap; }
      .caret { display: inline-block; width: 4px; height: 0.86em; background: #fff;
        vertical-align: -0.06em; margin-left: 6px; opacity: 0;
        animation: blink 1s steps(1,end) infinite; }
      @keyframes blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }

      .meta { display: flex; align-items: center; gap: 44px; opacity: 0; }
      .time { font-size: 38px; color: #8a8a8a; }
      .meta svg { width: 44px; height: 44px; stroke: #8a8a8a; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div class="bubble" id="bubble">
        <div class="btext"><span id="typed"></span><span class="caret" id="caret"></span></div>
      </div>
      <div class="meta" id="meta">
        <div class="time">12:36 PM</div>
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12 a8 8 0 1 0 2.5-5.8 M4 4 V8 H8" stroke="#8a8a8a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2.5" stroke="#8a8a8a" stroke-width="1.7"/><path d="M16 8 V6 a2 2 0 0 0-2-2 H6 a2 2 0 0 0-2 2 V14 a2 2 0 0 0 2 2 H8" stroke="#8a8a8a" stroke-width="1.7"/></svg>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // bubble pops in
      tl.from("#bubble", { opacity: 0, scale: 0.9, y: 20, duration: 0.4, ease: "back.out(1.6)" }, 0.15);

      // type on
      const fullText = "Before I dig in, how do you want to work this?";
      const typed = document.getElementById("typed");
      const proxy = { n: 0 };
      tl.to(proxy, {
        n: fullText.length, duration: 2.4, ease: "none",
        onUpdate() { typed.textContent = fullText.slice(0, Math.round(proxy.n)); },
        onComplete() { document.getElementById("caret").style.opacity = 1; },
      }, 0.5);

      // timestamp + actions fade in after typing
      tl.to("#meta", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
