<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #fff;
      }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .hero { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }

      /* Frosted-glass composer. Anchored at the BOTTOM so it grows upward. */
      .composer {
        position: absolute; left: 326px; bottom: 268px; width: 1268px;
        border-radius: 28px;
        background: rgba(28,30,36,0.42);
        backdrop-filter: blur(26px) saturate(120%);
        -webkit-backdrop-filter: blur(26px) saturate(120%);
        border: 1px solid rgba(255,255,255,0.14);
        box-shadow: 0 30px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
        overflow: hidden;
      }
      .inner { padding: 40px 56px 0; }

      /* attachment */
      .attach { opacity: 0; height: 0; overflow: hidden; padding-bottom: 14px; }
      .thumb-wrap { display: inline-block; }
      .thumb { width: 200px; height: 190px; border-radius: 16px; overflow: hidden;
        box-shadow: 0 12px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.18); }
      .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
      .fname { font-size: 26px; color: #c9ccd2; margin-top: 14px; }

      .ptext { font-size: 40px; line-height: 1.34; font-weight: 400; color: #f3f3f3;
        text-shadow: 0 1px 10px rgba(0,0,0,0.35); white-space: pre-wrap; }
      .caret { display: inline-block; width: 3px; height: 0.9em; background: #fff;
        vertical-align: -0.08em; margin-left: 4px; opacity: 0; animation: blink 1s steps(1,end) infinite; }
      @keyframes blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }

      .toolbar { display: flex; align-items: center; gap: 40px; padding: 30px 44px 30px; margin-top: 28px; }
      .ti { display: inline-flex; align-items: center; gap: 16px; font-size: 30px; color: #d7d9de; }
      .ti svg { width: 32px; height: 32px; }
      .ti.plus svg { width: 36px; height: 36px; }
      .ti.cs { color: #6ea8ff; }
      .ti.cs .x { color: #8c8c93; margin-left: 8px; font-size: 28px; }
      .ti.model { margin-left: auto; }
      .send { width: 70px; height: 70px; border-radius: 50%; background: #fff;
        display: inline-flex; align-items: center; justify-content: center; }
      .send svg { width: 32px; height: 32px; }

      /* falling PDF that drops into the composer */
      .drop { position: absolute; left: 382px; top: -240px; width: 200px; height: 190px;
        border-radius: 16px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,0.6);
        border: 1px solid rgba(255,255,255,0.2); opacity: 0; }
      .drop img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
      <img class="hero" src="./assets/plate.png" alt="" />

      <div class="composer" id="composer">
        <div class="inner">
          <div class="attach" id="attach">
            <div class="thumb-wrap">
              <div class="thumb"><img src="./assets/pdf.png" alt="" /></div>
              <div class="fname">pepsi-coachella-...</div>
            </div>
          </div>
          <div class="ptext" id="ptextRow">Just got the creative brief. Adding a few thought starters and trends. Let's get sharp.</div>
        </div>
        <div class="toolbar">
          <div class="ti plus"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5 V19 M5 12 H19" stroke="#d7d9de" stroke-width="1.9" stroke-linecap="round"/></svg></div>
          <div class="ti"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7 H14 M18 7 H20 M4 17 H8 M12 17 H20" stroke="#d7d9de" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" stroke="#d7d9de" stroke-width="1.8"/><circle cx="10" cy="17" r="2.2" stroke="#d7d9de" stroke-width="1.8"/></svg> Tools</div>
          <div class="ti cs"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18 H15 M10 21 H14" stroke="#6ea8ff" stroke-width="1.8" stroke-linecap="round"/><path d="M12 3 a6 6 0 0 0-4 10.5 c0.8 0.8 1 1.4 1 2.5 H15 c0-1.1 0.2-1.7 1-2.5 A6 6 0 0 0 12 3 Z" stroke="#6ea8ff" stroke-width="1.8" stroke-linejoin="round"/></svg> Creative Strategist <span class="x">&#10005;</span></div>
          <div class="ti model"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 L13.4 9 L19 10.5 L13.4 12 L12 18 L10.6 12 L5 10.5 L10.6 9 Z" fill="#d7d9de"/><path d="M18 4 L18.7 6.3 L21 7 L18.7 7.7 L18 10 L17.3 7.7 L15 7 L17.3 6.3 Z" fill="#d7d9de"/></svg> Sonnet 4.6</div>
          <div class="send"><svg viewBox="0 0 24 24" fill="none"><path d="M12 19 V5" stroke="#111" stroke-width="2.6" stroke-linecap="round"/><path d="M6 11 L12 5 L18 11" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </div>
      </div>

      <!-- dropping PDF (lives above; animates down into the composer) -->
      <div class="drop" id="drop"><img src="./assets/pdf.png" alt="" /></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const attach = document.getElementById("attach");
      const drop = document.getElementById("drop");

      // 0.3s–1.1s: PDF drops in from above (toward the attach slot at ~y 470)
      tl.fromTo(drop,
        { y: 0, opacity: 0, rotation: -8, scale: 1.1 },
        { y: 710, opacity: 1, rotation: 0, scale: 1, duration: 0.8, ease: "power3.in" }, 0.3);

      // 1.1s: impact — hide the faller, reveal the docked attachment, bubble grows
      tl.set(drop, { opacity: 0 }, 1.12);
      tl.to(attach, { height: 268, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.12);
      // little settle bounce on the composer as it expands
      tl.fromTo("#composer", { scale: 1 }, { scale: 1.012, duration: 0.12, ease: "power2.out" }, 1.12);
      tl.to("#composer", { scale: 1, duration: 0.5, ease: "elastic.out(1,0.6)" }, 1.24);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
