<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #000000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #fff;
      }
      #root { display: flex; align-items: center; justify-content: center; }

      .box {
        width: 1850px;
        border: 2px solid #2f6bff;
        border-radius: 26px;
        background: #0a0a0a;
        padding: 50px 52px 44px;
      }
      .prompt-text {
        font-size: 98px; font-weight: 500; letter-spacing: -1px; color: #fff;
        white-space: pre; min-height: 120px; margin-bottom: 44px;
      }
      .caret {
        display: inline-block; width: 4px; height: 0.92em; background: #fff;
        vertical-align: -0.1em; margin-left: 6px;
        animation: blink 1.06s steps(1, end) infinite;
      }
      @keyframes blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }

      .toolbar { display: flex; align-items: center; gap: 22px; }
      .pill {
        display: inline-flex; align-items: center; gap: 16px;
        height: 88px; padding: 0 32px; border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.16); color: #f2f2f2;
        font-size: 36px; font-weight: 500; white-space: nowrap;
      }
      .pill svg { width: 38px; height: 38px; flex: none; }
      .icon-btn { width: 92px; padding: 0; justify-content: center; font-size: 52px; font-weight: 300; }
      .cm {
        background: #1f72ff; border-color: #1f72ff; color: #fff; font-weight: 600;
      }
      .cm .x { font-size: 34px; opacity: 0.9; margin-left: 8px; }
      .chev { font-size: 26px; opacity: 0.7; }
      .spacer { margin-left: auto; }
      .send {
        width: 96px; height: 96px; border-radius: 50%; background: #f0531a;
        display: inline-flex; align-items: center; justify-content: center; flex: none;
      }
      .send svg { width: 46px; height: 46px; }

      #cursor {
        position: absolute; left: 0; top: 0; width: 46px; height: 46px;
        opacity: 0; pointer-events: none;
        filter: drop-shadow(0 3px 7px rgba(0,0,0,0.75));
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
      <div class="box">
        <div class="prompt-text"><span id="typed"></span><span class="caret"></span></div>

        <div class="toolbar">
          <div class="pill icon-btn">+</div>
          <div class="pill">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3" y="3" width="7" height="7" rx="1.4" stroke="#fff" stroke-width="1.7"/>
              <rect x="14" y="3" width="7" height="7" rx="1.4" stroke="#fff" stroke-width="1.7"/>
              <rect x="3" y="14" width="7" height="7" rx="1.4" stroke="#fff" stroke-width="1.7"/>
              <rect x="14" y="14" width="7" height="7" rx="1.4" stroke="#fff" stroke-width="1.7"/>
            </svg>
            Tools
          </div>
          <div class="pill cm">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M9 4 a3 3 0 0 0-3 3 a3 3 0 0 0-1 5 a3 3 0 0 0 2 4 a2.5 2.5 0 0 0 3 2 V4 Z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M15 4 a3 3 0 0 1 3 3 a3 3 0 0 1 1 5 a3 3 0 0 1-2 4 a2.5 2.5 0 0 1-3 2 V4 Z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            CM Creative <span class="x">&#10005;</span>
          </div>

          <div class="pill spacer">Sonnet 4.6 <span class="chev">&#9662;</span></div>
          <div class="send" id="send">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 19 V5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
              <path d="M6 11 L12 5 L18 11" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>

      <svg id="cursor" viewBox="0 0 24 24" fill="none">
        <path d="M5 3 L5 19 L9.2 15 L12 21 L14.5 19.8 L11.8 14 L17.5 14 Z" fill="#fff" stroke="#0a0a0a" stroke-width="1.1" stroke-linejoin="round"/>
      </svg>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const fullText = "Make it presentable.";
      const typed = document.getElementById("typed");
      const proxy = { n: 0 };

      // 0.15s–1.65s: type the prompt one character at a time
      tl.to(proxy, {
        n: fullText.length, duration: 1.5, ease: "none",
        onUpdate() { typed.textContent = fullText.slice(0, Math.round(proxy.n)); },
      }, 0.15);

      // Rest the cursor tip on the orange send button (fixed to rendered layout)
      const cursor = document.getElementById("cursor");
      gsap.set(cursor, { left: 1776, top: 628 });

      // 1.75s–2.4s: cursor flies in from lower-right and lands on send
      tl.fromTo(cursor,
        { x: 90, y: 240, opacity: 0 },
        { x: 0, y: 0, opacity: 1, duration: 0.65, ease: "power3.out" }, 1.75);

      // 2.45s: press + orange glow
      tl.to("#send", { scale: 0.93, duration: 0.1, ease: "power2.in" }, 2.45);
      tl.to("#send", { scale: 1, duration: 0.16, ease: "power2.out" }, 2.55);
      tl.to("#send", {
        boxShadow: "0 0 0 5px rgba(240,83,26,0.32), 0 0 44px rgba(240,83,26,0.6)",
        duration: 0.2, ease: "power2.out",
      }, 2.45);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
