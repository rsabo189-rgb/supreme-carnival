<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #050505;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #fff;
      }
      #root { position: relative; }

      .sidebar { position: absolute; left: 0; top: 0; width: 230px; height: 1080px;
        border-right: 1px solid rgba(255,255,255,0.08); }
      .logo { position: absolute; left: 26px; top: 40px; width: 168px; mix-blend-mode: lighten; }
      .avatar { position: absolute; left: 56px; bottom: 40px; width: 64px; height: 64px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center;
        font-size: 27px; color: #cfcfcf; }

      .main { position: absolute; left: 292px; top: 44px; right: 80px; }
      .doc-title { font-size: 27px; letter-spacing: 3px; color: #8a8a8a; margin-bottom: 18px;
        text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.14); padding-bottom: 20px; }

      .row { display: flex; justify-content: space-between; align-items: center;
        padding: 26px 4px; border-bottom: 1px solid rgba(255,255,255,0.09);
        font-size: 42px; color: #f0f0f0; }
      .row .amt { font-variant-numeric: tabular-nums; }

      .subrow { display: flex; justify-content: space-between; align-items: flex-end;
        margin-top: 30px; }
      .sub-l { display: flex; flex-direction: column; gap: 8px; }
      .sub-l .t { font-size: 60px; font-weight: 700; }
      .sub-l .note { font-size: 27px; font-style: italic; color: #8a8a8a; }
      .gl { display: inline-block; }
      .sub-amt { font-size: 92px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; }

      .acts { display: flex; gap: 34px; margin-top: 30px; }
      .acts svg { width: 34px; height: 34px; stroke: #7d7d7d; }

      .composer { position: absolute; left: 292px; right: 80px; bottom: 40px; height: 330px;
        border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; }
      .crow { position: absolute; left: 34px; right: 34px; bottom: 30px; display: flex; align-items: center; gap: 24px; }
      .cpill { display: inline-flex; align-items: center; gap: 16px; height: 80px; padding: 0 28px;
        border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); font-size: 33px; color: #e6e6e6; }
      .cpill svg { width: 34px; height: 34px; }
      .icon-btn { width: 80px; padding: 0; justify-content: center; font-size: 46px; font-weight: 300; }
      .cm { background: #1f72ff; border-color: #1f72ff; color: #fff; font-weight: 600; }
      .cm .x { margin-left: 6px; opacity: 0.9; }
      .sel { margin-left: auto; }
      .chev { font-size: 22px; opacity: 0.7; }

      /* Glitch styling: each animated text gets RGB split via custom props */
      .gl { position: relative; display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">

      <div class="sidebar">
        <img class="logo" src="./assets/wonder-logo.png" alt="WONDER" />
        <div class="avatar">W</div>
      </div>

      <div class="main">
        <div class="doc-title gl" data-final="PEPSI SUMMER 2026 · BALLPARK BUDGET">PEPSI SUMMER 2026 · BALLPARK BUDGET</div>

        <div class="row"><span class="gl" data-final="Production">Production</span><span class="amt gl" data-final="$187,500">$187,500</span></div>
        <div class="row"><span class="gl" data-final="Post Production">Post Production</span><span class="amt gl" data-final="$94,000">$94,000</span></div>
        <div class="row"><span class="gl" data-final="Talent">Talent</span><span class="amt gl" data-final="$62,000">$62,000</span></div>
        <div class="row"><span class="gl" data-final="Casting">Casting</span><span class="amt gl" data-final="$28,000">$28,000</span></div>
        <div class="row" style="border-bottom:2px solid rgba(255,255,255,0.4)"><span class="gl" data-final="Travel + Logistics">Travel + Logistics</span><span class="amt gl" data-final="$48,000">$48,000</span></div>

        <div class="subrow">
          <div class="sub-l">
            <div class="t gl" data-final="Subtotal">Subtotal</div>
            <div class="note gl" data-final="Base estimate · +10% contingency available">Base estimate · +10% contingency available</div>
          </div>
          <div class="sub-amt gl" data-final="$419,500">$419,500</div>
        </div>

        <div class="acts">
          <svg viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="#7d7d7d" stroke-width="1.5"/><path d="M16 8 V6 a2 2 0 0 0-2-2 H6 a2 2 0 0 0-2 2 V14 a2 2 0 0 0 2 2 H8" stroke="#7d7d7d" stroke-width="1.5"/></svg>
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 10 V20 H5 V10 Z M7 10 L11 3 a2 2 0 0 1 2 2 V8 H18 a1.5 1.5 0 0 1 1.5 2 L18 19 a1.5 1.5 0 0 1-1.5 1 H7" stroke="#7d7d7d" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <svg viewBox="0 0 24 24" fill="none"><path d="M17 14 V4 H19 V14 Z M17 14 L13 21 a2 2 0 0 1-2-2 V16 H6 a1.5 1.5 0 0 1-1.5-2 L6 5 a1.5 1.5 0 0 1 1.5-1 H17" stroke="#7d7d7d" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 9 V15 H8 L13 19 V5 L8 9 Z" stroke="#7d7d7d" stroke-width="1.5" stroke-linejoin="round"/><path d="M16 9 a4 4 0 0 1 0 6" stroke="#7d7d7d" stroke-width="1.5" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12 a8 8 0 0 1 13-6 M20 6 V11 H15 M20 12 a8 8 0 0 1-13 6 M4 18 V13 H9" stroke="#7d7d7d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>

      <div class="composer">
        <div class="crow">
          <div class="cpill icon-btn">+</div>
          <div class="cpill"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.4" stroke="#e6e6e6" stroke-width="1.7"/><rect x="14" y="3" width="7" height="7" rx="1.4" stroke="#e6e6e6" stroke-width="1.7"/><rect x="3" y="14" width="7" height="7" rx="1.4" stroke="#e6e6e6" stroke-width="1.7"/><rect x="14" y="14" width="7" height="7" rx="1.4" stroke="#e6e6e6" stroke-width="1.7"/></svg> Tools</div>
          <div class="cpill cm"><svg viewBox="0 0 24 24" fill="none"><path d="M9 4 a3 3 0 0 0-3 3 a3 3 0 0 0-1 5 a3 3 0 0 0 2 4 a2.5 2.5 0 0 0 3 2 V4 Z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 4 a3 3 0 0 1 3 3 a3 3 0 0 1 1 5 a3 3 0 0 1-2 4 a2.5 2.5 0 0 1-3 2 V4 Z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg> CM Brain <span class="x">&#10005;</span></div>
          <div class="cpill sel">Sonnet 4.6 <span class="chev">&#9662;</span></div>
        </div>
      </div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#%&*+=/<>";
      // deterministic pseudo-random from two ints
      function rnd(a, b) {
        let h = (a * 73856093) ^ (b * 19349663);
        h = (h ^ (h >>> 13)) * 1274126177;
        return ((h >>> 0) % 1000) / 1000;
      }

      const els = gsap.utils.toArray(".gl");

      els.forEach((el, idx) => {
        const finalText = el.getAttribute("data-final");
        const isAmount = el.classList.contains("amt") || el.classList.contains("sub-amt");
        const st = 0.25 + idx * 0.2;          // staggered glitch-in
        const dur = 0.62;
        const p = { v: 0 };

        // set initial state: offset + heavy RGB split
        gsap.set(el, { opacity: 0 });

        tl.to(p, {
          v: 1, duration: dur, ease: "power2.out",
          onStart() { el.style.opacity = 1; },
          onUpdate() {
            const prog = p.v;
            // 1) character scramble that resolves left->right
            const reveal = Math.floor(prog * finalText.length * 1.25);
            const tick = Math.floor(prog * 18); // scramble churn
            let out = "";
            for (let i = 0; i < finalText.length; i++) {
              const ch = finalText[i];
              if (ch === " " || i < reveal) { out += ch; }
              else { out += GLYPHS[Math.floor(rnd(idx * 97 + i, tick) * GLYPHS.length)]; }
            }
            el.textContent = out;

            // 2) RGB channel split + slice jitter, decaying with progress
            const amp = (1 - prog);
            const jx = (rnd(idx, tick) - 0.5) * 26 * amp;
            const r = 9 * amp, c = 9 * amp;
            el.style.transform = "translateX(" + (jx) + "px)";
            el.style.textShadow =
              (r) + "px 0 rgba(255,40,60,0.9), " + (-c) + "px 0 rgba(0,220,255,0.9)";
            // 3) occasional opacity flicker early on
            el.style.opacity = (prog < 0.85 && rnd(tick, idx) > 0.82) ? 0.45 : 1;
          },
          onComplete() {
            el.textContent = finalText;
            el.style.transform = "translateX(0)";
            el.style.textShadow = "none";
            el.style.opacity = 1;
          },
        }, st);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
