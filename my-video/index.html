<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      #root { position: relative; width: 1920px; height: 1080px; background: #000; overflow: hidden; }

      /* camera wrapper we scale/rotate to "fly in" */
      .cam {
        position: absolute; inset: 0;
        transform-origin: 46% 50%;   /* the black-hole center */
        will-change: transform, filter;
      }
      .portal {
        position: absolute; inset: 0;
        width: 1920px; height: 1080px;
        object-fit: cover;
        will-change: transform;
      }
      /* RGB-split ghosts of the portal for the glitch/chaos */
      .ghost {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        object-fit: cover; mix-blend-mode: screen; opacity: 0;
        will-change: transform, opacity;
      }
      .ghost.r { }
      .ghost.c { }

      /* spinning energy ring overlay around the hole */
      .swirl {
        position: absolute; left: 46%; top: 50%; width: 1500px; height: 1500px;
        margin-left: -750px; margin-top: -750px; border-radius: 50%;
        background: conic-gradient(from 0deg,
          rgba(255,255,255,0) 0deg, rgba(255,255,255,0.5) 40deg, rgba(255,255,255,0) 90deg,
          rgba(255,255,255,0) 180deg, rgba(255,255,255,0.4) 220deg, rgba(255,255,255,0) 270deg);
        -webkit-mask: radial-gradient(circle, transparent 26%, #000 33%, #000 46%, transparent 54%);
                mask: radial-gradient(circle, transparent 26%, #000 33%, #000 46%, transparent 54%);
        mix-blend-mode: screen; opacity: 0; will-change: transform, opacity;
      }

      /* sparks flung off the rim */
      .spark { position: absolute; left: 46%; top: 50%; width: 6px; height: 6px; border-radius: 50%;
        background: #fff; opacity: 0; will-change: transform, opacity;
        box-shadow: 0 0 8px 2px rgba(255,255,255,0.8); }

      .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      .vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 46% 50%, transparent 30%, rgba(0,0,0,0.55) 75%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div class="cam" id="cam">
        <img class="portal" id="portal" src="./assets/portal.png" alt="" />
        <img class="ghost r" id="ghostR" src="./assets/portal.png" alt="" />
        <img class="ghost c" id="ghostC" src="./assets/portal.png" alt="" />
        <div class="swirl" id="swirl"></div>
        <div id="sparks"></div>
        <div class="vignette"></div>
      </div>
      <div class="flash" id="flash"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      function rnd(a,b){ let h=(a*73856093)^(b*19349663); h=(h^(h>>>13))*1274126177; return ((h>>>0)%1000)/1000; }

      // Build deterministic sparks around the rim
      const sparksEl = document.getElementById("sparks");
      const sparks = [];
      for (let i=0;i<26;i++){
        const s = document.createElement("div");
        s.className = "spark";
        sparksEl.appendChild(s);
        sparks.push(s);
      }

      // ---- Phase 1 (0-2.2s): chaos spin-up ----
      // slow portal pull + continuous rotation
      tl.fromTo("#portal", { scale: 1.0, rotation: 0 }, { scale: 1.18, rotation: 26, duration: 2.2, ease: "power1.in" }, 0);
      // swirl ring fades in and spins fast
      tl.to("#swirl", { opacity: 0.9, duration: 0.6 }, 0.3);
      tl.fromTo("#swirl", { rotation: 0 }, { rotation: 320, duration: 2.4, ease: "power2.in" }, 0.3);

      // RGB-split ghosts pulse in with jitter (chaos)
      [["#ghostR", "rgba(255,40,60,1)", 1], ["#ghostC", "rgba(0,210,255,1)", -1]].forEach(([sel, col, dir], gi) => {
        gsap.set(sel, { filter: "none" });
        for (let k=0;k<11;k++){
          const t = 0.5 + k*0.15;
          const amp = (t/2.2);
          const dx = (rnd(gi*51+k, 7)-0.5) * 30 * amp * dir;
          const dy = (rnd(gi*23+k, 9)-0.5) * 14 * amp;
          tl.set(sel, { x: dx + dir*8, y: dy, opacity: 0.35 + 0.4*amp }, t);
          tl.set(sel, { opacity: 0 }, t + 0.07);
        }
      });

      // sparks fling outward, staggered, with chaotic angles
      sparks.forEach((s, i) => {
        const ang = rnd(i, 3) * Math.PI * 2;
        const dist = 360 + rnd(i, 5) * 520;
        const t = 0.6 + rnd(i, 11) * 1.3;
        const ex = Math.cos(ang) * dist;
        const ey = Math.sin(ang) * dist;
        tl.fromTo(s, { x: Math.cos(ang)*180, y: Math.sin(ang)*180, opacity: 0, scale: 1 },
          { x: ex, y: ey, opacity: 1, scale: 0.2, duration: 0.5 + rnd(i,13)*0.4, ease: "power2.out" }, t);
        tl.to(s, { opacity: 0, duration: 0.2 }, t + 0.4);
      });

      // micro screen-shake intensifying through chaos
      for (let k=0;k<16;k++){
        const t = 0.7 + k*0.09;
        const amp = (t/2.3) * 16;
        tl.set("#cam", { "--sx": 0 }, t); // noop keep timing
        tl.to("#root", { x: (rnd(k,1)-0.5)*amp, y: (rnd(k,2)-0.5)*amp, duration: 0.045 }, t);
      }
      tl.to("#root", { x: 0, y: 0, duration: 0.05 }, 2.2);

      // ---- Phase 2 (2.2-2.85s): FLY THROUGH the black center ----
      tl.to("#cam", { scale: 9, duration: 0.62, ease: "power3.in" }, 2.2);
      tl.to("#portal", { rotation: 70, duration: 0.62, ease: "power3.in" }, 2.2);
      tl.to("#swirl", { rotation: 560, opacity: 0, duration: 0.62, ease: "power3.in" }, 2.2);
      tl.to(".vignette", { opacity: 0, duration: 0.4 }, 2.2);

      // ---- Phase 3 (~2.8s): punch-through flash, then black on the other side ----
      tl.set("#flash", { opacity: 0 }, 2.74);
      tl.to("#flash", { opacity: 1, duration: 0.1, ease: "power2.in" }, 2.74);
      tl.to("#flash", { opacity: 0, duration: 0.5, ease: "power2.out" }, 2.86);
      tl.set("#cam", { opacity: 0 }, 2.85); // we've passed through -> black

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
