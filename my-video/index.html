<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      #root { position: relative; width: 1920px; height: 1080px; background: #000; overflow: hidden; }

      /* camera wrapper for global shake/fly-in */
      .cam { position: absolute; inset: 0; transform-origin: 46% 50%; will-change: transform; }

      /* tunnel: stacked rings, each a copy of the portal, at increasing depth */
      .tunnel { position: absolute; left: 46%; top: 50%; transform-origin: center; will-change: transform; }
      .ring {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        margin-left: -883px; margin-top: -540px;   /* center the hole (46% x) on origin */
        background-image: url("./assets/portal.png");
        background-size: cover; background-position: 46% 50%;
        transform-origin: center; will-change: transform, opacity;
        mix-blend-mode: screen;
      }

      /* spinning energy swirl right at the throat */
      .swirl {
        position: absolute; left: 46%; top: 50%; width: 1400px; height: 1400px;
        margin-left: -700px; margin-top: -700px; border-radius: 50%;
        background: conic-gradient(from 0deg,
          rgba(255,255,255,0) 0deg, rgba(255,255,255,0.55) 38deg, rgba(255,255,255,0) 84deg,
          rgba(255,255,255,0) 170deg, rgba(255,255,255,0.45) 210deg, rgba(255,255,255,0) 260deg);
        -webkit-mask: radial-gradient(circle, transparent 22%, #000 30%, #000 48%, transparent 56%);
                mask: radial-gradient(circle, transparent 22%, #000 30%, #000 48%, transparent 56%);
        mix-blend-mode: screen; opacity: 0; will-change: transform, opacity;
      }

      .spark { position: absolute; left: 46%; top: 50%; width: 6px; height: 6px; border-radius: 50%;
        background: #fff; opacity: 0; will-change: transform, opacity;
        box-shadow: 0 0 9px 2px rgba(255,255,255,0.85); }

      .gR, .gC { position: absolute; inset: 0; width: 1920px; height: 1080px;
        background-image: url("./assets/portal.png"); background-size: cover; background-position: 46% 50%;
        mix-blend-mode: screen; opacity: 0; will-change: transform, opacity; }

      .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      .vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 46% 50%, transparent 26%, rgba(0,0,0,0.6) 72%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="cam" id="cam">
        <div class="tunnel" id="tunnel"></div>
        <div class="gR" id="gR"></div>
        <div class="gC" id="gC"></div>
        <div class="swirl" id="swirl"></div>
        <div id="sparks"></div>
        <div class="vignette"></div>
      </div>
      <div class="flash" id="flash"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      function rnd(a,b){ let h=(a*73856093)^(b*19349663); h=(h^(h>>>13))*1274126177; return ((h>>>0)%1000)/1000; }

      const DUR = 5;
      const tunnel = document.getElementById("tunnel");

      // ---- Build the tunnel: many depth rings, smallest = farthest ----
      const N = 9;
      const rings = [];
      for (let i=0;i<N;i++){
        const r = document.createElement("div");
        r.className = "ring";
        // depth 0 (near) .. N-1 (far). Far rings tiny + dim.
        const depth = i / (N-1);
        const baseScale = 1.0 - depth * 0.86;     // 1.0 -> ~0.14
        r.dataset.base = baseScale;
        r.dataset.depth = depth;
        r.style.opacity = (1 - depth*0.55).toFixed(3);
        r.style.transform = "scale("+baseScale+")";
        // alternate spin direction per ring for churn
        r.dataset.dir = (i % 2 === 0) ? 1 : -1;
        tunnel.appendChild(r);
        rings.push(r);
      }

      // sparks
      const sparksEl = document.getElementById("sparks");
      const sparks = [];
      for (let i=0;i<40;i++){ const s=document.createElement("div"); s.className="spark"; sparksEl.appendChild(s); sparks.push(s); }

      // ---- CONTINUOUS rotation of the whole tunnel, accelerating the entire time ----
      // use a proxy that ramps angle non-linearly so spin speeds up (frenetic)
      const spin = { a: 0 };
      tl.to(spin, {
        a: 1, duration: DUR, ease: "power2.in",
        onUpdate(){
          const p = spin.a;
          const ang = p * 900;                 // up to 900deg, accelerating
          tunnel.style.transform = "rotate("+ang+"deg)";
          // each ring also counter/extra spins + drifts toward camera (depth scroll)
          for (let i=0;i<N;i++){
            const r = rings[i];
            const base = parseFloat(r.dataset.base);
            const dir = parseFloat(r.dataset.dir);
            // depth scroll: rings grow over time (flying down the tunnel), looping
            const speed = 0.9 + i*0.12;
            let s = base * (1 + p*p*7*speed);
            const localAng = dir * (ang*0.6 + i*40);
            r.style.transform = "rotate("+localAng+"deg) scale("+s+")";
            r.style.opacity = (parseFloat(r.style.opacity));
          }
        }
      }, 0);

      // swirl energizes + spins hard the whole time
      tl.to("#swirl", { opacity: 0.9, duration: 0.5 }, 0.2);
      tl.fromTo("#swirl", { rotation: 0 }, { rotation: 1100, duration: DUR, ease: "power2.in" }, 0);

      // ---- frenetic RGB-split jitter ghosts, denser & constant ----
      [["#gR", 1], ["#gC", -1]].forEach(([sel, dir], gi) => {
        for (let k=0;k<26;k++){
          const t = 0.3 + k*0.16;
          const amp = 0.3 + (t/DUR);
          const dx = (rnd(gi*51+k,7)-0.5) * 40 * amp * dir + dir*10;
          const dy = (rnd(gi*23+k,9)-0.5) * 22 * amp;
          tl.set(sel, { x: dx, y: dy, opacity: 0.3 + 0.4*amp }, t);
          tl.set(sel, { opacity: 0 }, t + 0.06);
        }
      });

      // ---- sparks streaming outward continuously (frenetic) ----
      sparks.forEach((s,i) => {
        const ang = rnd(i,3)*Math.PI*2;
        const dist = 320 + rnd(i,5)*760;
        const t = 0.2 + rnd(i,11)*4.0;
        const dur = 0.4 + rnd(i,13)*0.45;
        tl.fromTo(s, { x: Math.cos(ang)*120, y: Math.sin(ang)*120, opacity: 0, scale: 1.2 },
          { x: Math.cos(ang)*dist, y: Math.sin(ang)*dist, opacity: 1, scale: 0.15, duration: dur, ease: "power2.out" }, t);
        tl.to(s, { opacity: 0, duration: 0.18 }, t + dur*0.7);
      });

      // ---- continuous, intensifying screen shake the entire run ----
      for (let k=0;k<70;k++){
        const t = 0.2 + k*0.066;
        if (t > DUR-0.2) break;
        const amp = (t/DUR) * 26;
        tl.to("#root", { x: (rnd(k,1)-0.5)*amp, y: (rnd(k,2)-0.5)*amp, duration: 0.04 }, t);
      }

      // ---- the dive: camera also pushes in, peaking at the end (deep tunnel pull) ----
      tl.to("#cam", { scale: 4.5, duration: DUR, ease: "power3.in" }, 0);
      tl.to(".vignette", { opacity: 0, duration: 0.6 }, DUR-0.7);

      // final punch-through flash, then black
      tl.set("#flash", { opacity: 0 }, DUR-0.32);
      tl.to("#flash", { opacity: 1, duration: 0.12, ease: "power2.in" }, DUR-0.32);
      tl.to("#flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, DUR-0.18);
      tl.set("#cam", { opacity: 0 }, DUR-0.16);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
