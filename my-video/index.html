<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #060606;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #fff;
      }
      #root { position: relative; }

      .sidebar { position: absolute; left: 0; top: 0; width: 116px; height: 1080px;
        border-right: 1px solid rgba(255,255,255,0.07); }
      .logo { position: absolute; left: 30px; top: 48px; width: 56px; mix-blend-mode: lighten; }
      .sic { position: absolute; left: 44px; width: 30px; height: 30px; }
      .sic svg { width: 30px; height: 30px; stroke: #b9b9b9; }
      .avatar { position: absolute; left: 38px; bottom: 38px; width: 44px; height: 44px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center;
        font-size: 19px; color: #cfcfcf; }

      .stage { position: absolute; left: 116px; right: 0; top: 0; bottom: 0; }
      .card {
        position: absolute; left: 400px; width: 980px;
        display: flex; align-items: center; gap: 40px;
        border: 1px solid rgba(255,255,255,0.12); border-radius: 22px;
        padding: 40px 48px; background: rgba(255,255,255,0.012);
      }
      #card1 { top: 208px; }
      #card2 { top: 412px; }
      .tile { width: 104px; height: 104px; flex: none; border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.04);
        display: flex; align-items: center; justify-content: center; }
      .tile svg { width: 52px; height: 52px; }
      .c-title { font-size: 42px; font-weight: 600; margin-bottom: 12px; }
      .c-sub { font-size: 30px; color: #8d8d8d; }

      .acts { position: absolute; left: 400px; top: 660px; display: flex; gap: 36px; }
      .acts svg { width: 36px; height: 36px; stroke: #6f6f6f; }

      .composer { position: absolute; left: 400px; top: 752px; width: 1360px; height: 300px;
        border: 1px solid rgba(255,255,255,0.1); border-radius: 22px; }
      .ph { position: absolute; left: 44px; top: 44px; font-size: 34px; color: #5c5c5c; }
      .crow { position: absolute; left: 30px; right: 30px; bottom: 28px; display: flex; align-items: center; gap: 36px; }
      .ci { display: inline-flex; align-items: center; gap: 16px; font-size: 32px; color: #cfcfcf; }
      .ci svg { width: 32px; height: 32px; }
      .ci.plus svg { width: 38px; height: 38px; }
      .ci.bb { color: #6ea8ff; }
      .ci.bb .x { color: #8c8c93; margin-left: 8px; }
      .ci.model { margin-left: auto; }
      .send { width: 66px; height: 66px; border-radius: 50%; background: rgba(255,255,255,0.1);
        display: inline-flex; align-items: center; justify-content: center; }
      .send svg { width: 30px; height: 30px; }
      .foot { position: absolute; left: 0; right: 0; top: 1078px; text-align: center;
        font-size: 26px; color: #5a5a5a; }

      #cursor { position: absolute; left: 0; top: 0; width: 46px; height: 46px; opacity: 0;
        pointer-events: none; filter: drop-shadow(0 3px 7px rgba(0,0,0,0.8)); }
      .gl { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">

      <div class="sidebar">
        <img class="logo" src="./assets/wonder-logo.png" alt="W" />
        <div class="sic" style="top:150px"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5 V19 M5 12 H19" stroke="#b9b9b9" stroke-width="1.7" stroke-linecap="round"/></svg></div>
        <div class="sic" style="top:248px"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#b9b9b9" stroke-width="1.7"/><path d="M16 16 L21 21" stroke="#b9b9b9" stroke-width="1.7" stroke-linecap="round"/></svg></div>
        <div class="avatar">R</div>
      </div>

      <div class="stage">
        <div class="card" id="card1">
          <div class="tile"><svg class="c-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#dcdcdc" stroke-width="1.5"/><path d="M15.5 8.5 L11 11 L8.5 15.5 L13 13 Z" fill="#dcdcdc"/></svg></div>
          <div>
            <div class="c-title gl" data-final="Guide me through it">Guide me through it</div>
            <div class="c-sub gl" data-final="We&rsquo;ll take it step by step together.">We&rsquo;ll take it step by step together.</div>
          </div>
        </div>

        <div class="card" id="card2">
          <div class="tile" id="tile2"><svg class="c-icon" viewBox="0 0 24 24" fill="none"><path d="M4 20 L4 16 L15 5 L19 9 L8 20 Z" stroke="#dcdcdc" stroke-width="1.5" stroke-linejoin="round"/><path d="M13 7 L17 11" stroke="#dcdcdc" stroke-width="1.5"/></svg></div>
          <div>
            <div class="c-title gl" data-final="Take a first stab">Take a first stab</div>
            <div class="c-sub gl" data-final="I&rsquo;ll take the lead and you can guide me.">I&rsquo;ll take the lead and you can guide me.</div>
          </div>
        </div>

        <div class="acts">
          <svg viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2.5" stroke="#6f6f6f" stroke-width="1.6"/><path d="M16 8 V6 a2 2 0 0 0-2-2 H6 a2 2 0 0 0-2 2 V14 a2 2 0 0 0 2 2 H8" stroke="#6f6f6f" stroke-width="1.6"/></svg>
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 10 V20 H5 V10 Z M7 10 L11 3 a2 2 0 0 1 2 2 V8 H18 a1.5 1.5 0 0 1 1.5 2 L18 19 a1.5 1.5 0 0 1-1.5 1 H7" stroke="#6f6f6f" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <svg viewBox="0 0 24 24" fill="none"><path d="M17 14 V4 H19 V14 Z M17 14 L13 21 a2 2 0 0 1-2-2 V16 H6 a1.5 1.5 0 0 1-1.5-2 L6 5 a1.5 1.5 0 0 1 1.5-1 H17" stroke="#6f6f6f" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12 a8 8 0 0 1 13-6 M20 6 V11 H15" stroke="#6f6f6f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>

        <div class="composer">
          <div class="ph">Write a message...</div>
          <div class="crow">
            <div class="ci plus"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5 V19 M5 12 H19" stroke="#cfcfcf" stroke-width="1.8" stroke-linecap="round"/></svg></div>
            <div class="ci"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7 H14 M18 7 H20 M4 17 H8 M12 17 H20" stroke="#cfcfcf" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" stroke="#cfcfcf" stroke-width="1.8"/><circle cx="10" cy="17" r="2.2" stroke="#cfcfcf" stroke-width="1.8"/></svg> Tools</div>
            <div class="ci bb"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2" stroke="#6ea8ff" stroke-width="1.7"/><path d="M8 7 H16 M8 11 H10 M13 11 H16 M8 14 H10 M13 14 H16 M8 17 H10 M13 17 H16" stroke="#6ea8ff" stroke-width="1.5" stroke-linecap="round"/></svg> Budget Builder <span class="x">&#10005;</span></div>
            <div class="ci model"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 L13.4 9 L19 10.5 L13.4 12 L12 18 L10.6 12 L5 10.5 L10.6 9 Z" fill="#cfcfcf"/></svg> Haiku 4.5</div>
            <div class="send"><svg viewBox="0 0 24 24" fill="none"><path d="M12 19 V5" stroke="#cfcfcf" stroke-width="2.4" stroke-linecap="round"/><path d="M6 11 L12 5 L18 11" stroke="#cfcfcf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>
        </div>
      </div>

      <svg id="cursor" viewBox="0 0 24 24" fill="none"><path d="M5 3 L5 19 L9.2 15 L12 21 L14.5 19.8 L11.8 14 L17.5 14 Z" fill="#fff" stroke="#0a0a0a" stroke-width="1.1" stroke-linejoin="round"/></svg>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const COBALT = "#1f5bff";
      const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=/<>?";
      function rnd(a,b){ let h=(a*73856093)^(b*19349663); h=(h^(h>>>13))*1274126177; return ((h>>>0)%1000)/1000; }

      // Cards + icon tiles glitch-build in (cards fade/scale, text glitch-resolves)
      gsap.set("#card1, #card2", { opacity: 0 });
      tl.to("#card1", { opacity: 1, duration: 0.3 }, 0.2);
      tl.from("#card1 .c-icon", { scale: 0, rotation: -40, opacity: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "back.out(1.7)" }, 0.25);
      tl.to("#card2", { opacity: 1, duration: 0.3 }, 0.9);
      tl.from("#card2 .c-icon", { scale: 0, rotation: -40, opacity: 0, transformOrigin: "50% 50%", duration: 0.5, ease: "back.out(1.7)" }, 0.95);

      const els = gsap.utils.toArray(".gl");
      els.forEach((el, idx) => {
        const finalText = el.getAttribute("data-final").replace("&rsquo;","’");
        const st = 0.3 + idx * 0.32;
        const p = { v: 0 };
        gsap.set(el, { opacity: 0 });
        tl.to(p, { v: 1, duration: 0.55, ease: "power2.out",
          onStart(){ el.style.opacity = 1; },
          onUpdate(){
            const prog = p.v; const reveal = Math.floor(prog*finalText.length*1.25); const tick = Math.floor(prog*20);
            let out=""; for(let i=0;i<finalText.length;i++){ const ch=finalText[i];
              if(ch===" "||ch===","||i<reveal) out+=ch; else out+=GLYPHS[Math.floor(rnd(idx*97+i,tick)*GLYPHS.length)]; }
            el.textContent = out;
            const amp=(1-prog); el.style.transform="translateX("+((rnd(idx,tick)-0.5)*20*amp)+"px)";
            el.style.textShadow=(7*amp)+"px 0 rgba(255,40,60,0.9), "+(-7*amp)+"px 0 rgba(0,220,255,0.9)";
            el.style.opacity=(prog<0.85 && rnd(tick,idx)>0.82)?0.45:1;
          },
          onComplete(){ el.textContent=finalText; el.style.transform="translateX(0)"; el.style.textShadow="none"; el.style.opacity=1; },
        }, st);
      });

      // cursor flies in and selects "Take a first stab"
      const cursor = document.getElementById("cursor");
      gsap.set(cursor, { left: 1380, top: 596 });
      tl.fromTo(cursor, { x: 320, y: 200, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, 2.6);

      // selection: cobalt highlight on card2
      tl.to("#card2", { scale: 0.992, duration: 0.12, ease: "power2.in" }, 3.7);
      tl.to("#card2", { scale: 1, duration: 0.22, ease: "power2.out" }, 3.82);
      tl.to("#card2", { borderColor: COBALT, boxShadow: "0 0 0 2px "+COBALT+", 0 0 42px rgba(31,91,255,0.45)", duration: 0.3 }, 3.7);
      tl.to("#tile2", { borderColor: COBALT, backgroundColor: "rgba(31,91,255,0.16)", duration: 0.3 }, 3.76);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
