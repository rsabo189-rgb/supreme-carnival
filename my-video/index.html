<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #fff;
      }
      #root { position: relative; }

      .heading {
        position: absolute; left: 110px; top: 120px; width: 1660px;
        font-size: 104px; line-height: 1.14; font-weight: 500; letter-spacing: -1.5px;
        color: #fff; min-height: 360px;
      }
      .heading .gl { display: inline; }
      .caret {
        display: inline-block; width: 4px; height: 0.86em; background: #fff;
        vertical-align: -0.08em; margin-left: 8px; opacity: 0;
        animation: blink 1.0s steps(1, end) infinite;
      }
      @keyframes blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }

      .options {
        position: absolute; left: 112px; top: 760px;
        display: flex; gap: 150px;
      }
      .opt {
        display: inline-flex; align-items: center; gap: 26px;
        font-size: 44px; color: #8c8c8c; font-weight: 400;
      }
      .opt svg { width: 46px; height: 46px; flex: none; stroke: #8c8c8c; }
      .opt .gl { display: inline-block; }

      .composer {
        position: absolute; left: 110px; right: 110px; bottom: 70px;
        height: 132px; border: 1px solid rgba(255,255,255,0.12); border-radius: 22px;
        display: flex; align-items: center; gap: 32px; padding: 0 40px;
      }
      .strat {
        display: inline-flex; align-items: center; gap: 20px;
        border: 1px solid #d4831f; border-radius: 14px; padding: 18px 26px;
        color: #e0902f; font-size: 38px; font-weight: 500;
      }
      .strat svg { width: 38px; height: 38px; flex: none; }
      .strat .chev { font-size: 26px; opacity: 0.85; }
      .placeholder { font-size: 40px; color: #5c5c5c; }
      .clip { margin-left: auto; }
      .clip svg { width: 44px; height: 44px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">

      <div class="heading"><span class="gl" data-final="Before I dig in, how do you want to work on this?">Before I dig in, how do you want to work on this?</span><span class="caret" id="caret"></span></div>

      <div class="options">
        <div class="opt">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 6 C10 4.5 6 4.5 4 5 V19 C6 18.5 10 18.5 12 20 C14 18.5 18 18.5 20 19 V5 C18 4.5 14 4.5 12 6 Z" stroke="#8c8c8c" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M12 6 V20" stroke="#8c8c8c" stroke-width="1.5"/>
          </svg>
          <span class="gl" data-final="Guide me through it">Guide me through it</span>
        </div>
        <div class="opt">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M13 2 L4 14 H11 L10 22 L20 9 H12 Z" stroke="#8c8c8c" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <span class="gl" data-final="Take a first stab">Take a first stab</span>
        </div>
      </div>

      <div class="composer">
        <div class="strat">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2 L15 9 L12 14 L9 9 Z" stroke="#e0902f" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M12 14 V20" stroke="#e0902f" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="12" cy="9" r="1.1" fill="#e0902f"/>
          </svg>
          Creative Strategist <span class="chev">&#9662;</span>
        </div>
        <div class="placeholder">Message...</div>
        <div class="clip">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M20 11 L11.5 19.5 a4 4 0 0 1-6-6 L14 5 a2.7 2.7 0 0 1 4 4 L9.5 17.5 a1.4 1.4 0 0 1-2-2 L15 8" stroke="#9a9a9a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#%&*+=/<>?";
      function rnd(a, b) {
        let h = (a * 73856093) ^ (b * 19349663);
        h = (h ^ (h >>> 13)) * 1274126177;
        return ((h >>> 0) % 1000) / 1000;
      }

      const els = gsap.utils.toArray(".gl");

      els.forEach((el, idx) => {
        const finalText = el.getAttribute("data-final");
        const st = 0.25 + idx * 0.45;
        const dur = idx === 0 ? 1.4 : 0.6; // heading glitches longer
        const p = { v: 0 };
        gsap.set(el, { opacity: 0 });

        tl.to(p, {
          v: 1, duration: dur, ease: "power2.out",
          onStart() { el.style.opacity = 1; },
          onUpdate() {
            const prog = p.v;
            const reveal = Math.floor(prog * finalText.length * 1.25);
            const tick = Math.floor(prog * 26);
            let out = "";
            for (let i = 0; i < finalText.length; i++) {
              const ch = finalText[i];
              if (ch === " " || ch === "," || i < reveal) out += ch;
              else out += GLYPHS[Math.floor(rnd(idx * 131 + i, tick) * GLYPHS.length)];
            }
            el.textContent = out;

            const amp = (1 - prog);
            const jx = (rnd(idx, tick) - 0.5) * 24 * amp;
            const r = 8 * amp, c = 8 * amp;
            el.style.display = "inline-block";
            el.style.transform = "translateX(" + jx + "px)";
            el.style.textShadow = r + "px 0 rgba(255,40,60,0.9), " + (-c) + "px 0 rgba(0,220,255,0.9)";
            el.style.opacity = (prog < 0.85 && rnd(tick, idx) > 0.82) ? 0.45 : 1;
          },
          onComplete() {
            el.textContent = finalText;
            el.style.transform = "translateX(0)";
            el.style.textShadow = "none";
            el.style.opacity = 1;
            if (idx === 0) document.getElementById("caret").style.opacity = 1;
          },
        }, st);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
