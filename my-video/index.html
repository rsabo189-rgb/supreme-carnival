<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #0d0d0d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #fff;
      }
      #root { position: relative; }

      .sidebar { position: absolute; left: 0; top: 0; width: 140px; height: 1080px;
        border-right: 1px solid rgba(255,255,255,0.07); }
      .logo { position: absolute; left: 16px; top: 40px; width: 108px; mix-blend-mode: lighten; }
      .avatar { position: absolute; left: 26px; bottom: 34px; width: 52px; height: 52px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center;
        font-size: 22px; color: #cfcfcf; }

      .content { position: absolute; left: 310px; top: 50px; width: 1440px; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-size: 74px; font-weight: 600;
        letter-spacing: -0.5px; margin-bottom: 26px; }
      .sub { font-size: 28px; color: #8f8f8f; line-height: 1.4; margin-bottom: 52px; }

      .fields { display: flex; gap: 26px; margin-bottom: 42px; }
      .field { flex: 1; }
      .field.proj { flex: 1.45; }
      .lbl { font-size: 25px; color: #8f8f8f; margin-bottom: 14px; }
      .inp { height: 84px; border: 1px solid rgba(255,255,255,0.16); border-radius: 12px;
        display: flex; align-items: center; justify-content: space-between; padding: 0 26px;
        font-size: 30px; color: #efefef; }
      .inp .chev { color: #9a9a9a; font-size: 22px; }

      .brief-box { border: 1px solid rgba(255,255,255,0.16); border-radius: 16px;
        padding: 34px 36px; height: 268px; position: relative; }
      .brief-text { font-size: 30px; line-height: 1.42; color: #e8e8e8; }
      .caret { display: inline-block; width: 3px; height: 0.92em; background: #e8e8e8;
        vertical-align: -0.1em; margin-left: 3px; animation: blink 1s steps(1,end) infinite; }
      @keyframes blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }
      .count { position: absolute; left: 36px; bottom: 24px; font-size: 24px; color: #6a6a6a; }

      .gen { width: 600px; height: 86px; margin: 44px auto 0; background: #ededed; color: #111;
        border-radius: 14px; display: flex; align-items: center; justify-content: center;
        font-size: 34px; font-weight: 500; }

      .composer { position: absolute; left: 310px; right: 170px; bottom: 34px; height: 128px;
        border: 1px solid rgba(255,255,255,0.12); border-radius: 20px;
        display: flex; align-items: center; gap: 26px; padding: 0 34px; }
      .cpill { display: inline-flex; align-items: center; gap: 14px; font-size: 30px; color: #d8d8d8; }
      .cpill svg { width: 30px; height: 30px; }
      .amber { border: 1px solid #7a5e2e; background: rgba(140,108,52,0.18); border-radius: 14px;
        padding: 16px 24px; color: #d6ab68; }
      .amber svg { stroke: #d6ab68; }
      .amber .x { color: #b0905a; margin-left: 6px; font-size: 26px; }
      .sel { margin-left: auto; border: 1px solid rgba(255,255,255,0.16); border-radius: 12px;
        padding: 16px 24px; }
      .chev { font-size: 22px; opacity: 0.7; }
      .csend { width: 64px; height: 64px; border-radius: 50%; background: #ef5f1c;
        display: inline-flex; align-items: center; justify-content: center; }
      .csend svg { width: 30px; height: 30px; }

      #cursor { position: absolute; left: 0; top: 0; width: 46px; height: 46px; opacity: 0;
        pointer-events: none; filter: drop-shadow(0 3px 7px rgba(0,0,0,0.8)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">

      <div class="sidebar">
        <img class="logo" src="./assets/wonder-logo.png" alt="WONDER" />
        <div class="avatar">W</div>
      </div>

      <div class="content">
        <h1>Welcome to the Workshop.</h1>
        <div class="sub">Tell us about your project. The more detail, the better<br/>your storyboard.</div>

        <div class="fields">
          <div class="field proj"><div class="lbl">Project</div><div class="inp">PEPSI SUMMER 2026</div></div>
          <div class="field"><div class="lbl">Client</div><div class="inp">Pepsi</div></div>
          <div class="field"><div class="lbl">Format</div><div class="inp">30s <span class="chev">&#9662;</span></div></div>
          <div class="field"><div class="lbl">Aspect</div><div class="inp">16:9 <span class="chev">&#9662;</span></div></div>
        </div>

        <div class="lbl">Brief</div>
        <div class="brief-box">
          <div class="brief-text"><span id="typed"></span><span class="caret"></span></div>
          <div class="count" id="count">0/2000</div>
        </div>

        <div class="gen" id="gen">Generate Storyboard</div>
      </div>

      <div class="composer">
        <div class="cpill"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5 V19 M5 12 H19" stroke="#d8d8d8" stroke-width="1.8" stroke-linecap="round"/></svg></div>
        <div class="cpill"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.4" stroke="#d8d8d8" stroke-width="1.7"/><rect x="14" y="3" width="7" height="7" rx="1.4" stroke="#d8d8d8" stroke-width="1.7"/><rect x="3" y="14" width="7" height="7" rx="1.4" stroke="#d8d8d8" stroke-width="1.7"/><rect x="14" y="14" width="7" height="7" rx="1.4" stroke="#d8d8d8" stroke-width="1.7"/></svg> Tools</div>
        <div class="cpill amber">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 4 a3 3 0 0 0-3 3 a3 3 0 0 0-1 5 a3 3 0 0 0 2 4 a2.5 2.5 0 0 0 3 2 V4 Z" stroke="#d6ab68" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 4 a3 3 0 0 1 3 3 a3 3 0 0 1 1 5 a3 3 0 0 1-2 4 a2.5 2.5 0 0 1-3 2 V4 Z" stroke="#d6ab68" stroke-width="1.5" stroke-linejoin="round"/></svg>
          AMBER Creative Strategist <span class="x">&#10005;</span>
        </div>
        <div class="cpill sel">Sonnet 4.6 <span class="chev">&#9662;</span></div>
        <div class="csend"><svg viewBox="0 0 24 24" fill="none"><path d="M12 19 V5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M6 11 L12 5 L18 11" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>

      <svg id="cursor" viewBox="0 0 24 24" fill="none">
        <path d="M5 3 L5 19 L9.2 15 L12 21 L14.5 19.8 L11.8 14 L17.5 14 Z" fill="#fff" stroke="#0a0a0a" stroke-width="1.1" stroke-linejoin="round"/>
      </svg>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const fullText = "A bold, sun-soaked summer film for Pepsi that captures the feeling of long days, real connection and unforgettable moments. Fast-paced, music-driven, and full of movement — from city streets to open water. Show a diverse group of friends chasing the best kind of summer, with Pepsi at the center of every moment. Leave viewers with an irresistible urge to grab a Pepsi and make their own story.";
      const typed = document.getElementById("typed");
      const count = document.getElementById("count");
      const proxy = { n: 0 };

      // Brief builds in (0.3s–3.6s)
      tl.to(proxy, {
        n: fullText.length, duration: 3.3, ease: "none",
        onUpdate() {
          const k = Math.round(proxy.n);
          typed.textContent = fullText.slice(0, k);
          count.textContent = k + "/2000";
        },
      }, 0.3);

      // Cursor flies to "Generate Storyboard" and clicks
      const cursor = document.getElementById("cursor");
      gsap.set(cursor, { left: 1070, top: 852 });
      tl.fromTo(cursor,
        { x: 220, y: 150, opacity: 0 },
        { x: 0, y: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, 3.9);

      // Button press
      tl.to("#gen", { scale: 0.97, backgroundColor: "#d2d2d2", duration: 0.12, ease: "power2.in" }, 4.95);
      tl.to("#gen", { scale: 1, backgroundColor: "#ededed", duration: 0.2, ease: "power2.out" }, 5.07);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
